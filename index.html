<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Check-in da academia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap" rel="stylesheet">
<style>
  :root {
    --giz: #ECEEF0;        /* fundo: parede de academia, giz */
    --borracha: #2B3138;   /* texto: piso de borracha */
    --cinza: #6B737C;      /* texto secundário */
    --linha: #CBD0D5;
    --azul: #1D4E9E;       /* anilha de 20 kg: Rodrigo */
    --amarelo: #E3A812;    /* anilha de 15 kg: Aline */
    --vermelho: #B8322A;   /* anilha de 25 kg: cancelar/erro */
    --pessoa: var(--azul);
    --pessoa-tinta: var(--azul);
    --condensada: "Archivo", system-ui, sans-serif;
  }
  body[data-pessoa="aline"] { --pessoa: var(--amarelo); --pessoa-tinta: #8A6400; }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--giz); color: var(--borracha);
    font: 400 16px/1.45 var(--condensada); font-stretch: 100%;
    padding: max(20px, env(safe-area-inset-top)) 18px max(32px, env(safe-area-inset-bottom));
  }
  main { max-width: 460px; margin: 0 auto; }
  h1 {
    font-stretch: 62%; font-weight: 800; font-size: 44px; line-height: .95;
    letter-spacing: -.01em; margin: 6px 0 22px;
  }
  h2 { font-stretch: 75%; font-weight: 700; font-size: 22px; margin: 0 0 10px; }
  section { margin-bottom: 26px; }
  .ajuda { color: var(--cinza); font-size: 14px; margin: -4px 0 10px; }

  /* anilhas: quem vai treinar */
  .anilhas { display: flex; gap: 14px; }
  .anilha {
    flex: 1; display: flex; align-items: center; gap: 12px; cursor: pointer;
    background: none; border: 2px solid var(--linha); border-radius: 999px;
    padding: 6px 16px 6px 6px; font: inherit; color: inherit; text-align: left;
  }
  .anilha .disco {
    width: 46px; height: 46px; border-radius: 50%; flex: none; position: relative;
    background: var(--cor); box-shadow: inset 0 0 0 5px rgba(0,0,0,.18);
  }
  .anilha .disco::after {  /* furo central da anilha */
    content: ""; position: absolute; inset: 17px; border-radius: 50%; background: var(--giz);
  }
  .anilha .disco.foto {
    background: var(--foto) center / cover; box-shadow: 0 0 0 3px var(--cor);
  }
  .anilha .disco.foto::after { display: none; }
  .anilha b { display: block; font-stretch: 75%; font-size: 20px; font-weight: 700; line-height: 1.1; }
  .anilha small { color: var(--cinza); font-size: 13px; }
  .anilha[aria-pressed="true"] { border-color: var(--cor); background: #fff; }

  /* dias */
  .dias { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
  .dia {
    font: inherit; color: inherit; background: #fff; border: 2px solid transparent; border-radius: 10px;
    padding: 6px 0 8px; cursor: pointer; text-align: center;
  }
  .dia span { display: block; font-size: 13px; color: var(--cinza); }
  .dia b { display: block; font-stretch: 62%; font-size: 26px; font-weight: 800; line-height: 1; }
  .dia[aria-pressed="true"] { border-color: var(--pessoa); }

  /* horários: o quadro de horários da academia */
  .horarios { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .hora {
    font: inherit; font-stretch: 62%; font-weight: 800; font-size: 30px; line-height: 1;
    background: none; color: var(--borracha); border: 0; border-bottom: 3px solid var(--linha);
    padding: 10px 0 8px; cursor: pointer; font-variant-numeric: tabular-nums;
  }
  .hora[aria-pressed="true"] { border-bottom-color: var(--pessoa); color: var(--pessoa-tinta); }
  .outro { margin-top: 12px; display: flex; gap: 10px; align-items: center; color: var(--cinza); font-size: 14px; }
  .outro input { font: inherit; padding: 6px 8px; border: 2px solid var(--linha); border-radius: 8px; background: #fff; color: var(--borracha); }

  /* treino */
  .treinos { display: flex; gap: 8px; }
  .treino {
    flex: 1; font: inherit; font-stretch: 75%; font-weight: 700; font-size: 18px; cursor: pointer;
    padding: 12px; border-radius: 10px; border: 2px solid var(--linha); background: none; color: inherit;
  }
  .treino[aria-pressed="true"] { border-color: var(--pessoa); background: #fff; }

  .agendar {
    width: 100%; font: inherit; font-stretch: 75%; font-weight: 800; font-size: 22px;
    padding: 16px; border: 0; border-radius: 12px; cursor: pointer;
    background: var(--pessoa); color: #fff;
  }
  body[data-pessoa="aline"] .agendar { color: var(--borracha); }
  .agendar:disabled { opacity: .5; cursor: wait; }
  .resumo { text-align: center; color: var(--cinza); font-size: 14px; margin: 8px 0 0; min-height: 1.4em; }

  /* agenda */
  .lista { list-style: none; margin: 0; padding: 0; }
  .item {
    display: grid; grid-template-columns: 8px 1fr auto; gap: 12px; align-items: center;
    padding: 12px 0; border-bottom: 1px solid var(--linha);
  }
  .item .cor { align-self: stretch; border-radius: 4px; background: var(--cor); }
  .item b { font-stretch: 75%; font-size: 19px; font-weight: 700; display: block; line-height: 1.15; }
  .item small { color: var(--cinza); font-size: 14px; display: block; }
  .item.cancelado b { text-decoration: line-through; color: var(--cinza); }
  .cancelar {
    font: inherit; font-size: 14px; color: var(--vermelho); background: none; cursor: pointer;
    border: 1.5px solid currentColor; border-radius: 8px; padding: 6px 10px;
  }
  .vazio { color: var(--cinza); }

  .msg { border-radius: 10px; padding: 10px 12px; font-size: 15px; margin: 0 0 16px; display: none; }
  .msg.ok { display: block; background: #fff; border-left: 5px solid #2E7D4F; }
  .msg.erro { display: block; background: #fff; border-left: 5px solid var(--vermelho); }

  details { border-top: 1px solid var(--linha); padding-top: 14px; }
  summary { cursor: pointer; font-stretch: 75%; font-weight: 700; font-size: 18px; }
  details ol { padding-left: 20px; font-size: 14px; color: var(--cinza); }
  details input[type=password] {
    width: 100%; font: inherit; padding: 10px; border: 2px solid var(--linha); border-radius: 8px; background: #fff; margin: 8px 0;
  }
  .linha-botoes { display: flex; gap: 8px; }
  .sec {
    font: inherit; font-size: 15px; padding: 8px 12px; border-radius: 8px; cursor: pointer;
    border: 2px solid var(--borracha); background: none; color: var(--borracha);
  }
  a { color: var(--azul); }
  button:focus-visible, input:focus-visible, summary:focus-visible { outline: 3px solid var(--pessoa-tinta); outline-offset: 2px; }
  @media (prefers-reduced-motion: no-preference) {
    .anilha, .dia, .hora, .treino { transition: border-color .15s, color .15s, background .15s; }
  }
</style>
</head>
<body data-pessoa="rodrigo">
<main>
  <h1>Check-in da academia</h1>
  <p id="msg" class="msg" role="status"></p>

  <div id="app">
  <section aria-labelledby="t-quem">
    <h2 id="t-quem">Quem vai treinar</h2>
    <div class="anilhas" id="pessoas"></div>
  </section>

  <section aria-labelledby="t-dia">
    <h2 id="t-dia">Dia</h2>
    <div class="dias" id="dias"></div>
  </section>

  <section aria-labelledby="t-hora">
    <h2 id="t-hora">Horário</h2>
    <div class="horarios" id="horarios"></div>
  </section>

  <section aria-labelledby="t-treino">
    <h2 id="t-treino">Treino</h2>
    <div class="treinos" id="treinos"></div>
  </section>

  <section>
    <button class="agendar" id="agendar">Agendar check-in</button>
    <p class="resumo" id="resumo"></p>
  </section>

  <section aria-labelledby="t-agenda">
    <h2 id="t-agenda">Próximas aulas</h2>
    <ul class="lista" id="lista"><li class="vazio">Carregando…</li></ul>
  </section>
  </div>

  <details id="config" style="margin-bottom:24px">
    <summary>Chave do GitHub</summary>
    <p class="ajuda" style="margin-top:8px">Fica salva só neste navegador. Sem ela a página não consegue ler nem salvar a agenda.</p>
    <input type="password" id="token" placeholder="github_pat_…" autocomplete="off">
    <div class="linha-botoes">
      <button class="sec" id="salvarToken">Salvar chave</button>
      <button class="sec" id="apagarToken">Apagar deste navegador</button>
    </div>
  </details>
</main>

<script>
const REPO = "rodrigoberaweb/robo-blocksfit";
const ARQUIVO = "agenda.json";
const PESSOAS = [
  { id: "rodrigo", nome: "Rodrigo", cor: "var(--azul)" },
  { id: "aline", nome: "Aline", cor: "var(--amarelo)" },
];
const HORARIOS = ["06:00","07:30","09:00","10:30","12:00","13:30","15:00","16:30","18:00","19:30","21:00"];
const TREINOS = ["Membros Superiores", "Membros Inferiores"];
const DIAS = ["dom","seg","ter","qua","qui","sex","sáb"];
const MESES = ["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];

const guardar = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch {} },
};

const estado = {
  pessoa: guardar.get("pessoa") || "rodrigo",
  dia: null, hora: null, treino: TREINOS[0],
  agenda: [], sha: null,
};
const $ = (id) => document.getElementById(id);

/* ---------- datas (horário de Brasília) ---------- */
function agoraBR() {  // Date cujos campos UTC são a hora de Brasília
  return new Date(Date.now() - 3 * 3600e3);
}
function chaveDia(d) { return d.toISOString().slice(0, 10); }
function paraData(aula) {  // "2026-11-27 09:00" -> Date (campos UTC = hora local)
  return new Date(aula.replace(" ", "T") + ":00Z");
}
function textoDia(d) { return `${DIAS[d.getUTCDay()]} ${d.getUTCDate()}/${String(d.getUTCMonth() + 1).padStart(2, "0")}`; }
function textoHora(d) { return `${d.getUTCHours()}h${String(d.getUTCMinutes()).padStart(2, "0")}`; }

/* ---------- montar a tela ---------- */
function botao(cls, html, ativo, onclick, extra = {}) {
  const b = document.createElement("button");
  b.className = cls; b.innerHTML = html; b.type = "button";
  b.setAttribute("aria-pressed", ativo ? "true" : "false");
  b.onclick = onclick;
  Object.assign(b.style, extra);
  return b;
}

function desenhar() {
  document.body.dataset.pessoa = estado.pessoa;

  const p = $("pessoas"); p.innerHTML = "";
  for (const x of PESSOAS) {
    const qtd = estado.agenda.filter(a => (a.pessoa || "rodrigo") === x.id && !a.cancelado && paraData(a.aula) > agoraBR()).length;
    const foto = fotos[x.id];
    const b = botao("anilha", `<span class="disco${foto ? " foto" : ""}"${foto ? ` style="--foto:url('${foto}')"` : ""}></span><span><b>${x.nome}</b><small>${qtd ? qtd + (qtd > 1 ? " aulas marcadas" : " aula marcada") : "nenhuma aula"}</small></span>`,
      estado.pessoa === x.id, () => { estado.pessoa = x.id; guardar.set("pessoa", x.id); desenhar(); });
    b.style.setProperty("--cor", x.cor);
    p.append(b);
  }

  const d = $("dias"); d.innerHTML = "";
  const hoje = agoraBR(); hoje.setUTCHours(0, 0, 0, 0);
  for (let i = 0; i < 7; i++) {
    const dia = new Date(hoje.getTime() + i * 864e5);
    const k = chaveDia(dia);
    if (!estado.dia) estado.dia = chaveDia(new Date(hoje.getTime() + 864e5)); // amanhã
    d.append(botao("dia", `<span>${i === 0 ? "hoje" : DIAS[dia.getUTCDay()]}</span><b>${dia.getUTCDate()}</b>`,
      estado.dia === k, () => { estado.dia = k; desenhar(); }));
  }

  const h = $("horarios"); h.innerHTML = "";
  for (const hr of HORARIOS) {
    h.append(botao("hora", hr.replace(":00", "h").replace(":30", "h30"), estado.hora === hr,
      () => { estado.hora = hr; desenhar(); }));
  }

  const t = $("treinos"); t.innerHTML = "";
  for (const tr of TREINOS) {
    t.append(botao("treino", tr.replace("Membros ", ""), estado.treino === tr, () => { estado.treino = tr; desenhar(); }));
  }

  atualizarResumo();
  desenharLista();
}

function aulaEscolhida() {
  if (!estado.dia || !estado.hora) return null;
  return `${estado.dia} ${estado.hora}`;
}

function atualizarResumo() {
  const aula = aulaEscolhida();
  const r = $("resumo");
  if (!aula) { r.textContent = "Escolha o dia e o horário."; return; }
  const d = paraData(aula), abre = new Date(d.getTime() - 864e5);
  if (d <= agoraBR()) { r.textContent = "Esse horário já passou."; return; }
  r.textContent = abre <= agoraBR()
    ? "O check-in já está liberado: o robô marca assim que você agendar."
    : `O robô marca no segundo em que abrir: ${textoDia(abre)} às ${textoHora(abre)}.`;
}

function desenharLista() {
  const l = $("lista"); l.innerHTML = "";
  const agora = agoraBR();
  const futuras = estado.agenda
    .filter(a => paraData(a.aula) > agora)
    .sort((a, b) => a.aula.localeCompare(b.aula));
  if (!estado.sha && !guardar.get("token")) {
    l.innerHTML = '<li class="vazio">Cole a chave do GitHub no topo da página pra ver e agendar aulas.</li>'; return;
  }
  if (!futuras.length) { l.innerHTML = '<li class="vazio">Nenhuma aula agendada. Escolha dia e horário acima.</li>'; return; }
  for (const a of futuras) {
    const pessoa = PESSOAS.find(p => p.id === (a.pessoa || "rodrigo")) || PESSOAS[0];
    const d = paraData(a.aula), abre = new Date(d.getTime() - 864e5);
    let status;
    if (a.cancelado) status = "Cancelado";
    else if (abre > agora) status = `Check-in abre ${textoDia(abre)} às ${textoHora(abre)}`;
    else status = "Check-in liberado. Confira o aviso no ntfy";
    const li = document.createElement("li");
    li.className = "item" + (a.cancelado ? " cancelado" : "");
    li.style.setProperty("--cor", pessoa.cor);
    li.innerHTML = `<span class="cor"></span><span><b>${textoDia(d)}, ${textoHora(d)}</b>
      <small>${pessoa.nome}, ${a.treino.replace("Membros ", "")}</small><small>${status}</small></span>`;
    if (!a.cancelado) {
      const c = document.createElement("button");
      c.className = "cancelar"; c.type = "button"; c.textContent = "Cancelar";
      c.onclick = () => cancelar(a);
      li.append(c);
    } else li.append(document.createElement("span"));
    l.append(li);
  }
}

function mensagem(texto, tipo = "ok") {
  const m = $("msg"); m.textContent = texto; m.className = "msg " + tipo;
  m.scrollIntoView({ block: "nearest" });
}

/* ---------- GitHub ---------- */
function b64paraTexto(b64) {
  const bin = atob(b64.replace(/\n/g, ""));
  return new TextDecoder().decode(Uint8Array.from(bin, c => c.charCodeAt(0)));
}
function textoParaB64(txt) {
  const bytes = new TextEncoder().encode(txt);
  let bin = ""; bytes.forEach(b => bin += String.fromCharCode(b));
  return btoa(bin);
}
async function api(metodo, corpo) {
  const token = guardar.get("token");
  if (!token) throw new Error("sem-chave");
  const r = await fetch(`https://api.github.com/repos/${REPO}/contents/${ARQUIVO}`, {
    method: metodo, cache: "no-store",
    headers: { Authorization: `Bearer ${token}`, Accept: "application/vnd.github+json" },
    body: corpo ? JSON.stringify(corpo) : undefined,
  });
  if (r.status === 401) throw new Error("A chave do GitHub foi recusada. Confira se copiou inteira ou gere outra.");
  if (r.status === 403 || r.status === 404) throw new Error("A chave não tem acesso ao robo-blocksfit. Gere uma com Contents: Read and write nesse repositório.");
  if (r.status === 409 || r.status === 422) throw new Error("conflito");
  if (!r.ok) throw new Error(`O GitHub respondeu com erro ${r.status}. Tente de novo em instantes.`);
  return r.json();
}
async function carregar() {
  const j = await api("GET");
  estado.agenda = JSON.parse(b64paraTexto(j.content));
  estado.sha = j.sha;
}
async function salvar(mudar, descricao) {
  for (let tentativa = 0; tentativa < 2; tentativa++) {
    await carregar();
    const limite = new Date(agoraBR().getTime() - 864e5);
    let nova = estado.agenda.filter(a => paraData(a.aula) > limite);  // tira aulas antigas
    nova = mudar(nova);
    const texto = "[\n" + nova.map(a => "  " + JSON.stringify(a)).join(",\n") + "\n]\n";
    try {
      const r = await api("PUT", { message: descricao, content: textoParaB64(texto), sha: estado.sha });
      estado.agenda = nova; estado.sha = r.content.sha;
      return;
    } catch (e) {
      if (e.message !== "conflito" || tentativa) throw e;
    }
  }
}

/* ---------- fotos (ficam no repositório privado) ---------- */
const fotos = {};
for (const x of PESSOAS) { const f = guardar.get("foto-" + x.id); if (f) fotos[x.id] = f; }
async function carregarFotos() {
  const token = guardar.get("token");
  if (!token) return;
  for (const x of PESSOAS) {
    if (fotos[x.id]) continue;
    try {
      const r = await fetch(`https://api.github.com/repos/${REPO}/contents/fotos/${x.id}.jpg`, {
        headers: { Authorization: `Bearer ${token}`, Accept: "application/vnd.github+json" } });
      if (!r.ok) continue;
      const j = await r.json();
      fotos[x.id] = "data:image/jpeg;base64," + j.content.replace(/\n/g, "");
      guardar.set("foto-" + x.id, fotos[x.id]);
    } catch {}
  }
  desenhar();
}

/* ---------- ações ---------- */
async function agendar() {
  const aula = aulaEscolhida();
  if (!aula) return mensagem("Escolha o dia e o horário.", "erro");
  if (paraData(aula) <= agoraBR()) return mensagem("Esse horário já passou. Escolha outro.", "erro");
  const pessoa = estado.pessoa, nome = PESSOAS.find(p => p.id === pessoa).nome;
  const b = $("agendar"); b.disabled = true; b.textContent = "Agendando…";
  try {
    let repetida = false;
    await salvar(lista => {
      repetida = lista.some(a => (a.pessoa || "rodrigo") === pessoa && a.aula === aula && !a.cancelado);
      if (repetida) return lista;
      return lista.filter(a => !((a.pessoa || "rodrigo") === pessoa && a.aula === aula))
        .concat({ pessoa, aula, treino: estado.treino });
    }, `Agenda: ${nome} ${aula} ${estado.treino}`);
    const d = paraData(aula);
    mensagem(repetida ? `${nome} já tem essa aula agendada.` : `Agendado: ${nome}, ${textoDia(d)} às ${textoHora(d)}, ${estado.treino.replace("Membros ", "").toLowerCase()}.`, repetida ? "erro" : "ok");
  } catch (e) { mensagem(e.message === "sem-chave" ? "Cole a chave do GitHub no topo da página." : e.message, "erro"); }
  b.disabled = false; b.textContent = "Agendar check-in";
  desenhar();
}

async function cancelar(item) {
  const d = paraData(item.aula), nome = (PESSOAS.find(p => p.id === (item.pessoa || "rodrigo")) || PESSOAS[0]).nome;
  const jaAbriu = new Date(d.getTime() - 864e5) <= agoraBR();
  try {
    await salvar(lista => lista.flatMap(a => {
      const mesma = (a.pessoa || "rodrigo") === (item.pessoa || "rodrigo") && a.aula === item.aula;
      if (!mesma) return [a];
      return jaAbriu ? [{ ...a, cancelado: true }] : [];  // se já abriu, o robô cancela no app
    }), `Agenda: cancelar ${nome} ${item.aula}`);
    mensagem(jaAbriu
      ? `Cancelado: ${nome}, ${textoDia(d)} às ${textoHora(d)}. O robô desfaz o check-in no app em instantes.`
      : `Cancelado: ${nome}, ${textoDia(d)} às ${textoHora(d)}.`);
  } catch (e) { mensagem(e.message, "erro"); }
  desenhar();
}

$("agendar").onclick = agendar;
$("salvarToken").onclick = async () => {
  const v = $("token").value.trim();
  if (!v) return mensagem("Cole a chave antes de salvar.", "erro");
  guardar.set("token", v); $("token").value = "";
  try { await carregar(); mensagem("Chave salva. Agenda carregada."); carregarFotos(); }
  catch (e) { mensagem(e.message, "erro"); }
  posicionarChave(); desenhar();
};
$("apagarToken").onclick = () => { guardar.set("token", null); for (const x of PESSOAS) { guardar.set("foto-" + x.id, null); delete fotos[x.id]; } estado.agenda = []; estado.sha = null; mensagem("Chave apagada deste navegador."); posicionarChave(); desenhar(); };

function posicionarChave() {
  const c = $("config");
  const temChave = !!guardar.get("token");
  $("app").hidden = !temChave;
  if (temChave) { document.querySelector("main").append(c); c.open = false; }
  else { $("msg").after(c); c.open = true; }
}

(async () => {
  desenhar();
  posicionarChave();
  if (!guardar.get("token")) return;
  carregarFotos();
  try { await carregar(); } catch (e) { mensagem(e.message, "erro"); }
  desenhar();
})();
</script>
</body>
</html>
